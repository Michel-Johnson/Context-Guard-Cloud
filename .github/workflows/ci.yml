name: Cloud CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['*']
permissions:
  contents: read
concurrency:
  group: cloud-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:runtime
      - run: npm run security:setup
      - run: node .github/scripts/security-scan.mjs ci
      - run: npm run security:test
  test:
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:runtime
      - run: npm test
  minimum-runtime:
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '18'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.9'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:runtime
      - run: npm test
        env:
          CONTEXT_GUARD_CI_TEST_DIAGNOSTICS: '1'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ failure() && !cancelled() }}
        with:
          name: cloud-node18-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloud-node18-diagnostics/*.jsonl
          if-no-files-found: ignore
          retention-days: 1
  slack:
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:runtime
      - run: npm ci --prefix plugins/slack --ignore-scripts --no-audit --no-fund
      - run: npm run test:slack
  browser:
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:runtime
      - name: Bound browser dependency downloads
        shell: bash
        run: |
          set -euo pipefail
          # The hosted runner's Azure HTTP mirror can stall every index fetch.
          # Keep Ubuntu's archive keys/sources, using the official HTTPS archive.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "1";\n' | sudo tee /etc/apt/apt.conf.d/99-context-guard-ci-network > /dev/null
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: cloud-browser-evidence
          path: |
            output/playwright/browser-ci/**/result.json
            output/playwright/browser-ci/**/results.json
            output/playwright/browser-ci/**/failure.txt
            output/playwright/browser-ci/**/*.png
          if-no-files-found: warn
          retention-days: 3
  package:
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:runtime
      - run: npm run security:setup
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --ignore-scripts --json --pack-destination dist > "$RUNNER_TEMP/cloud-pack.json"
          artifact=$(node -e "process.stdout.write(require(process.argv[1])[0].filename)" "$RUNNER_TEMP/cloud-pack.json")
          node .github/scripts/security-scan.mjs package "dist/$artifact"
      - name: 验证 Cloud 仅生产依赖的独立运行
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npm run build:runtime
          node .github/scripts/cloud-installed-smoke.mjs .
  required:
    name: Required
    if: always()
    needs: [security, test, minimum-runtime, slack, browser, package]
    runs-on: ubuntu-latest
    steps:
      - env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.JOB_RESULTS); if(Object.keys(jobs).length!==6 || Object.values(jobs).some(job=>job.result!=="success")) process.exit(1)'
